<nx-circle-toggle-group
  [field]="control()"
  [readonly]="control()().readonly()"
  class="nx-margin-bottom-s"
>
  <nx-label [disabled]="control()().disabled()">Are you married?</nx-label>
  <nx-circle-toggle
    [value]="true"
    circleText="Yes"
    (selectionChange)="markDirty()"
  />
  <nx-circle-toggle
    [value]="false"
    circleText="No"
    (selectionChange)="markDirty()"
  />
  <nx-error class="nx-margin-top-xs">
    {{control()().errors().at(0)?.message}}
  </nx-error>
</nx-circle-toggle-group>
<div class="nx-margin-bottom-m">
  Dirty: {{ control()().dirty()}}, Touched: {{ control()().touched()}}
</div>
