<nx-circle-toggle-group [field]="field()" class="nx-margin-bottom-s">
  <nx-label [disabled]="field()().disabled()">Are you married?</nx-label>
  <nx-circle-toggle [value]="true" circleText="Yes" />
  <nx-circle-toggle [value]="false" circleText="No" />
  <nx-error class="nx-margin-top-xs">
    {{field()().errors().at(0)?.message}}
  </nx-error>
</nx-circle-toggle-group>
<div class="nx-margin-bottom-m">
  Dirty: {{ field()().dirty()}}, Touched: {{ field()().touched()}}
</div>
