<nx-circle-toggle-group
  [(ngModel)]="value"
  [ngModelOptions]="{ standalone: true }"
  [readonly]="readonly()"
  [disabled]="disabled()"
  [required]="required()"
  class="nx-margin-bottom-s"
>
  <nx-label [disabled]="disabled()">{{ label() }}</nx-label>
  <nx-circle-toggle [value]="true" circleText="Yes"/>
  <nx-circle-toggle [value]="false" circleText="No" />
  <nx-error> {{ errors() | error }} </nx-error>
</nx-circle-toggle-group>
