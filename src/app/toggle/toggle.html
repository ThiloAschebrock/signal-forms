<nx-circle-toggle-group
  [(value)]="value"
  [readonly]="readonly()"
  [disabled]="disabled()"
  (valueChange)="markAsTouched()"
  class="nx-margin-bottom-s"
>
  <nx-label>Are we asking too many questions?</nx-label>
  <nx-circle-toggle
    [value]="true"
    circleText="Yes"
    [class.has-error]="showError()"
  />
  <nx-circle-toggle
    [value]="false"
    circleText="No"
    [class.has-error]="showError()"
  />
</nx-circle-toggle-group>
@if (showError()) {
<nx-error class="nx-margin-top-xs"> {{errors().at(0)?.message}} </nx-error>
}
<div>Dirty: {{ dirty()}}, Touched: {{ touched()}}</div>
