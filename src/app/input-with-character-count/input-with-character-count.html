<nx-formfield
  [label]="fieldState().required?.() ? label() : `${label()} (optional)`"
>
  <input
    nxInput
    [field]="field()"
    [readonly]="fieldState().readonly()"
    [disabled]="fieldState().disabled()"
  />
  @if(hint()){
  <span nxFormfieldHint> {{hint()}} </span>
  }
  <nx-error nxFormfieldError> {{ fieldState().errors() | error}} </nx-error>
</nx-formfield>
