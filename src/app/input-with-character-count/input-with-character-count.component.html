<nx-formfield [label]="fieldState().required() ? label() : `${label()} (optional)`">
  <input nxInput [formField]="formField()" appTracking />
  @if (hint()) {
    <span nxFormfieldHint> {{ hint() }} </span>
  }
  <nx-error nxFormfieldError> {{ fieldState().errors() | error }} </nx-error>
</nx-formfield>
